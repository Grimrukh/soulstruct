# Soulstruct pyproject.toml configuration file for packaging and distribution.

[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "soulstruct"
description = "Inspect and modify files in FromSoftware games."
readme = "README.md"
version = "2.3.3"
license = "GPL-3.0-or-later"
requires-python = ">=3.13"  # Blender >=5.1
keywords = ["modding", "FromSoftware", "Dark Souls", "Bloodborne", "Elden Ring", "Sekiro", "Demon's Souls"]
classifiers = [
    "Programming Language :: Python :: 3",
]
authors = [
    { name = "Scott Mooney (Grimrukh)", email = "grimrukh@gmail.com" }
]

dependencies = [
    "constrata>=1.3.3",     # required for binary read/write (my package)
    "frozendict",           # required for frozen dictionaries
    "numpy",                # required for math classes/operations
    "rich>=13",             # required for nice printing/logging
    "typer",                # required for CLI
    "zstandard",            # required for ZSTD compression (Elden Ring regulation DCX)
]

[project.optional-dependencies]
runtime       = ["psutil"]
graphs        = ["matplotlib"]
sound         = ["pydub"]

[project.scripts]
soulstruct = "soulstruct.__main__:app"

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true

[tool.setuptools.package-data]
soulstruct = [
    "**/*.json",
    "**/*.txt",
    "**/*.xml",
    "**/*.dcx",
    "**/*.mtdbnd",
    "**/*.paramdefbnd",
    "**/*.dll",
    "**/*.exe",
    "**/*.pdb",
]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
# `importmode=importlib` + `consider_namespace_packages` keep collection working with the
# `soulstruct` namespace package and allow same-named test modules in different game folders.
addopts = "-ra --import-mode=importlib"
consider_namespace_packages = true
markers = [
    "game_data: test requires an unpacked vanilla game directory",
    "slow: test reads a whole game directory and is slow",
]
filterwarnings = ["default"]

[project.urls]
homepage      = "https://github.com/Grimrukh/soulstruct"
repository    = "https://github.com/Grimrukh/soulstruct"
"Issues"      = "https://github.com/Grimrukh/soulstruct/issues"
